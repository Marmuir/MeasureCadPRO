<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeasureCAD Pro - Análisis y Medición Avanzada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: { 
                        snap: '#22c55e',
                        cadbg: '#0b0f19',
                        axisX: '#ef4444',
                        axisY: '#22c55e'
                    } 
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { overflow: hidden; transition: background-color 0.3s ease, color 0.3s ease; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Fondo del canvas interactivo */
        .canvas-container {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transition: background-color 0.3s ease;
        }
        .dark .canvas-container {
            background-color: #0b0f19;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        }

        /* Estilos de botones de herramientas */
        .tool-btn { transition: all 0.2s ease; }
        .tool-btn:hover:not(.active) { background-color: rgba(148, 163, 184, 0.2); }
        .tool-btn.active {
            background-color: #0284c7; border-color: #38bdf8; color: #ffffff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .tool-btn.active-parallel {
            background-color: #d97706; border-color: #fbbf24; color: #ffffff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .tool-btn.active-axis {
            background-color: #7c3aed; border-color: #a78bfa; color: #ffffff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .snap-cb:checked + div { background-color: #22c55e; border-color: #22c55e; }
        .snap-cb:checked + div svg { opacity: 1; }
    </style>
</head>
<body class="h-screen flex flex-col antialiased bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-200">

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm z-20 flex-shrink-0 transition-colors">
        <div class="px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-sky-600 dark:text-sky-400 font-bold text-xl mr-2 tracking-tight">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                    MeasureCAD
                </div>
                
                <div class="relative">
                    <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
                    <button onclick="document.getElementById('fileInput').click()" class="flex items-center gap-2 bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded-md text-sm font-medium transition-colors shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Subir Plano
                    </button>
                </div>
            </div>

            <!-- Controles de Escala y UI -->
            <div class="flex items-center gap-2">
                <select id="presetScale" onchange="applyPredefinedScale(this.value)" class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 px-2 py-1.5 rounded-md text-sm font-medium outline-none hover:border-sky-500 focus:border-sky-500 cursor-pointer transition-colors" title="Escalas predeterminadas">
                    <option value="">Ajuste Manual...</option>
                    <option value="210">DIN A4 Vertical (210mm)</option>
                    <option value="297">DIN A4 Horiz. / A3 Vert. (297mm)</option>
                    <option value="420">DIN A3 Horizontal (420mm)</option>
                </select>

                <button class="tool-btn flex items-center gap-1.5 border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-md text-sm font-medium" onclick="setMode('calibrate')" title="Calibrar escala marcando 2 puntos">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>
                    Calibrar
                </button>

                <button id="btnRounding" class="flex items-center gap-1.5 border border-emerald-500 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 px-3 py-1.5 rounded-md text-sm font-bold transition-colors" onclick="toggleRounding()" title="Ajustar medidas al entero más cercano">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Redondeo: ON</span>
                </button>

                <button onclick="toggleTheme()" class="p-1.5 border border-slate-300 dark:border-slate-600 rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="Modo Día/Noche">
                    <svg id="themeIconDark" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="themeIconLight" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
            
            <div class="hidden xl:block h-6 w-px bg-slate-300 dark:bg-slate-600 mx-1"></div>

            <!-- Herramientas de Dibujo -->
            <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900 p-1 rounded-lg border border-slate-300 dark:border-slate-700 overflow-x-auto">
                <button class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium text-slate-700 dark:text-slate-300" onclick="setMode('line')" title="Línea Recta">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg> Línea
                </button>
                <button class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium text-slate-700 dark:text-slate-300" onclick="setMode('polyline')" title="Polilínea">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg> Polilínea
                </button>
                <button class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-amber-600 transition-colors" onclick="setMode('parallel-select')" title="Línea Paralela">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4v16M16 4v16"></path></svg> Paralela
                </button>

                <div class="h-4 w-px bg-slate-300 dark:bg-slate-600 mx-1"></div>

                <button class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-bold text-violet-700 dark:text-violet-400 bg-violet-100/50 dark:bg-violet-900/30 transition-colors" onclick="setMode('axis')" title="Alinear plano de trabajo (3D)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20h16M4 4v16m-8-8l-6-6m0 0v4m0-4h4"></path></svg> Definir Ejes (X,Y,Z)
                </button>
                <button id="btnActivePlane" class="hidden tool-btn items-center gap-1.5 px-2 py-1.5 rounded text-xs font-bold text-sky-600 dark:text-sky-400 border border-sky-300 dark:border-sky-800 hover:bg-sky-50 dark:hover:bg-sky-900/30 transition-colors" onclick="toggleActivePlane()" title="Cambiar Plano de Trabajo Activo">
                    🔄 Plano: XY
                </button>
                <button id="btnViewAxes" class="hidden tool-btn items-center gap-1.5 px-2 py-1.5 rounded text-xs font-bold text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors select-none" onmousedown="showAxes(true)" onmouseup="showAxes(false)" onmouseleave="showAxes(false)" ontouchstart="showAxes(true)" ontouchend="showAxes(false)" title="Mantener presionado para ver los ejes definidos">
                    👁️ Ver Ejes
                </button>
                <button id="btnResetAxis" class="hidden tool-btn items-center gap-1.5 px-2 py-1.5 rounded text-xs font-bold text-red-600 dark:text-red-400 border border-red-300 dark:border-red-800 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors" onclick="resetAxes()">
                    Reset
                </button>

                <div class="h-4 w-px bg-slate-300 dark:bg-slate-600 mx-1"></div>

                <button class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium text-slate-700 dark:text-slate-300" onclick="setMode('angle')" title="Medir Ángulo">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21a9 9 0 009-9H3a9 9 0 009 9zM12 3a9 9 0 00-9 9h18a9 9 0 00-9-9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12L21 12M12 12L18.36 5.64"></path></svg> Ángulo
                </button>
                <button class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-bold text-sky-700 dark:text-sky-400 bg-sky-100/50 dark:bg-sky-900/30 transition-colors" onclick="setMode('circle3p')" title="Círculo a partir de 3 puntos">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" stroke-width="2" stroke-dasharray="2 2"></circle>
                        <circle cx="12" cy="3" r="2" fill="currentColor"></circle>
                        <circle cx="4" cy="17" r="2" fill="currentColor"></circle>
                        <circle cx="20" cy="17" r="2" fill="currentColor"></circle>
                    </svg> Círculo 3D
                </button>
            </div>
        </div>
        
        <div class="bg-slate-100 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 px-4 py-2 flex flex-wrap justify-between items-center transition-colors shadow-inner gap-2">
            <div class="flex items-center gap-6">
                <!-- Modo Orto -->
                <button id="btnOrtho" onclick="toggleOrtho()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-bold border transition-colors shadow-sm bg-slate-200 dark:bg-slate-800 border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20h16M4 4v16"></path></svg>
                    <span>MODO ORTO: OFF</span>
                </button>

                <!-- OSNAP Controls -->
                <div class="flex items-center gap-4 text-xs">
                    <span class="font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1">
                        <svg class="w-4 h-4 text-snap" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
                        OSNAP:
                    </span>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="snapEndpoint" class="snap-cb hidden" checked onchange="toggleSnap('endpoint', this.checked)">
                        <div class="w-4 h-4 border border-slate-400 rounded flex items-center justify-center transition-colors"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>
                        <span class="text-slate-600 dark:text-slate-400">Extremo</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="snapMidpoint" class="snap-cb hidden" checked onchange="toggleSnap('midpoint', this.checked)">
                        <div class="w-4 h-4 border border-slate-400 rounded flex items-center justify-center transition-colors"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>
                        <span class="text-slate-600 dark:text-slate-400">Medio</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="snapCenter" class="snap-cb hidden" checked onchange="toggleSnap('center', this.checked)">
                        <div class="w-4 h-4 border border-slate-400 rounded flex items-center justify-center transition-colors"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>
                        <span class="text-slate-600 dark:text-slate-400">Centro</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="snapPerpendicular" class="snap-cb hidden" checked onchange="toggleSnap('perpendicular', this.checked)">
                        <div class="w-4 h-4 border border-slate-400 rounded flex items-center justify-center transition-colors"><svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>
                        <span class="text-slate-600 dark:text-slate-400">Perpendicular</span>
                    </label>
                </div>
            </div>

            <!-- Ayuda en vivo -->
            <div class="flex items-center gap-4 text-xs">
                <span id="axisStatus" class="bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-300 dark:border-slate-600">Espacio: 2D Plano</span>
                <span id="modeHint" class="text-sky-600 dark:text-sky-400 italic font-medium mr-4">Sube un documento para empezar.</span>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative">
        <div class="flex-1 relative canvas-container cursor-crosshair overflow-hidden shadow-inner" id="canvasWrapper">
            <canvas id="mainCanvas" class="absolute top-0 left-0 outline-none" tabindex="0"></canvas>
            
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none transition-opacity">
                <svg class="w-24 h-24 text-slate-400 dark:text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <h2 class="text-2xl font-bold text-slate-500 dark:text-slate-400 mb-2">Espacio de Trabajo Vacío</h2>
                <p class="text-slate-500">Sube un archivo PDF o una imagen desde la barra superior.</p>
            </div>
        </div>

        <aside class="w-[360px] bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 flex flex-col flex-shrink-0 z-10 transition-colors shadow-xl">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 flex justify-between items-center transition-colors shadow-sm">
                <h2 class="font-bold text-slate-800 dark:text-slate-200 text-lg flex items-center gap-2">
                    <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    Registro de Medidas
                </h2>
                <span class="bg-sky-100 dark:bg-sky-500/20 text-sky-700 dark:text-sky-400 text-xs font-bold px-2 py-0.5 rounded-full border border-sky-200 dark:border-sky-500/30" id="measureCount">0</span>
            </div>
            <div class="px-4 py-2 bg-slate-100 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700 flex justify-between text-xs text-slate-500 dark:text-slate-400">
                <span>Escala:</span>
                <span id="scaleDisplay" class="font-bold text-sky-600 dark:text-sky-400 font-mono">1 px = 1 px</span>
            </div>
            <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-2" id="measurementsList"></div>
        </aside>
    </main>

    <!-- Modales para UI -->
    <div id="calibrationModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-[400px] border border-slate-200 dark:border-slate-600 transition-colors">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Establecer Escala</h3>
            <p class="text-sm text-slate-600 dark:text-slate-300 mb-5">Introduce la distancia real que representa el segmento.</p>
            <div class="mb-6 flex gap-2">
                <input type="number" id="calibDistance" class="flex-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="Ej: 100" step="any">
                <select id="calibUnit" class="w-24 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white rounded-md px-2 py-2 outline-none">
                    <option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">in</option>
                </select>
            </div>
            <div class="flex justify-end gap-3">
                <button id="calibCancel" class="px-4 py-2 text-sm text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 rounded-md">Cancelar</button>
                <button id="calibSave" class="px-4 py-2 text-sm text-white bg-sky-600 hover:bg-sky-500 rounded-md">Aplicar</button>
            </div>
        </div>
    </div>

    <div id="infoModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-[350px] border border-slate-200 dark:border-slate-600 text-center transition-colors">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2" id="infoTitle">Info</h3>
            <p class="text-sm text-slate-600 dark:text-slate-300 mb-6" id="infoMessage">Mensaje.</p>
            <button id="infoClose" class="px-6 py-2 text-sm text-white bg-sky-600 hover:bg-sky-500 rounded-md w-full">Aceptar</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');
        
        let docImage = null; 
        let isSpacePressed = false;
        
        let state = {
            mode: 'none', 
            measurements: [],
            currentTrace: null,
            scaleFactor: 1, 
            unit: 'px',
            isDrawing: false,
            smartRounding: true,
            orthoMode: false,
            snaps: { endpoint: true, midpoint: true, center: true, perpendicular: true },
            parallelAngle: null, 
            hoveredSegment: null, 
            extensionLine: null,
            isTrackingExtension: false,
            showAxes: false,
            // SCP: Sistema de Coordenadas de Usuario para Isometricas (3D)
            plane: { active: false, activePlane: 'XY', origin: {x: 0, y: 0}, ux: {x: 1, y: 0}, uy: {x: 0, y: 1}, uz: {x: 0, y: 0}, activeUx: {x: 1, y: 0}, activeUy: {x: 0, y: 1} }
        };

        let activeSnap = null; 
        let view = { x: 0, y: 0, scale: 1, isPanning: false, startX: 0, startY: 0 };

        function resizeCanvas() { canvas.width = wrapper.clientWidth; canvas.height = wrapper.clientHeight; renderDrawings(); }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function showMessage(title, message) {
            document.getElementById('infoTitle').textContent = title;
            document.getElementById('infoMessage').textContent = message;
            document.getElementById('infoModal').classList.remove('hidden');
        }
        document.getElementById('infoClose').addEventListener('click', () => document.getElementById('infoModal').classList.add('hidden'));

        function toggleTheme() { document.documentElement.classList.toggle('dark'); renderDrawings(); }

        function toggleRounding() {
            state.smartRounding = !state.smartRounding;
            const btn = document.getElementById('btnRounding');
            if (state.smartRounding) {
                btn.className = "flex items-center gap-1.5 border border-emerald-500 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 px-3 py-1.5 rounded-md text-sm font-bold transition-colors";
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span>Redondeo: ON</span>`;
            } else {
                btn.className = "flex items-center gap-1.5 border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-1.5 rounded-md text-sm font-bold transition-colors";
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span>Redondeo: OFF</span>`;
            }
            updateSidebar(); renderDrawings();
        }

        function toggleOrtho() {
            state.orthoMode = !state.orthoMode;
            const btn = document.getElementById('btnOrtho');
            if (state.orthoMode) {
                btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-bold border transition-colors shadow-sm bg-sky-100 dark:bg-sky-900/40 border-sky-500 text-sky-700 dark:text-sky-400";
                btn.querySelector('span').textContent = 'MODO ORTO: ON';
            } else {
                btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-bold border transition-colors shadow-sm bg-slate-200 dark:bg-slate-800 border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700";
                btn.querySelector('span').textContent = 'MODO ORTO: OFF';
            }
            renderDrawings();
        }

        function toggleSnap(type, isEnabled) { state.snaps[type] = isEnabled; activeSnap = null; renderDrawings(); }

        function showAxes(show) { state.showAxes = show; renderDrawings(); }

        function toggleActivePlane() {
            if (!state.plane.active) return;
            const planes = ['XY', 'XZ', 'YZ'];
            let idx = planes.indexOf(state.plane.activePlane);
            state.plane.activePlane = planes[(idx + 1) % 3];
            
            if (state.plane.activePlane === 'XY') {
                state.plane.activeUx = { ...state.plane.ux }; state.plane.activeUy = { ...state.plane.uy };
            } else if (state.plane.activePlane === 'XZ') {
                state.plane.activeUx = { ...state.plane.ux }; state.plane.activeUy = { ...state.plane.uz };
            } else if (state.plane.activePlane === 'YZ') {
                state.plane.activeUx = { ...state.plane.uy }; state.plane.activeUy = { ...state.plane.uz };
            }

            document.getElementById('btnActivePlane').textContent = `🔄 Plano: ${state.plane.activePlane}`;
            document.getElementById('axisStatus').innerHTML = `<span class='text-amber-500 font-bold'>Espacio: 3D (Plano ${state.plane.activePlane})</span>`;
            renderDrawings();
        }

        // FIX BUG 2: Limpieza estricta de ejes
        function resetAxes() {
            // Desactiva el sistema afín y elimina las trazas de Ejes guardadas
            state.plane.active = false;
            state.plane.activePlane = 'XY';
            state.plane.activeUx = {x: 1, y: 0};
            state.plane.activeUy = {x: 0, y: 1};
            state.measurements = state.measurements.filter(m => m.type !== 'Ejes');
            state.currentTrace = null;
            state.isDrawing = false;
            state.showAxes = false;
            
            document.getElementById('btnResetAxis').classList.add('hidden');
            document.getElementById('btnActivePlane').classList.add('hidden');
            document.getElementById('btnViewAxes').classList.add('hidden');
            
            const st = document.getElementById('axisStatus');
            st.textContent = 'Espacio: 2D Plano';
            st.className = 'bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-300 dark:border-slate-600';
            
            setMode('line');
            renderDrawings(); // Limpia inmediatamente el canvas
        }

        function screenToLocal(p) {
            if (!state.plane.active) return { x: p.x, y: p.y };
            const dx = p.x - state.plane.origin.x; const dy = p.y - state.plane.origin.y;
            const u1 = state.plane.activeUx; const u2 = state.plane.activeUy;
            const det = u1.x * u2.y - u1.y * u2.x;
            if (Math.abs(det) < 0.0001) return { x: p.x, y: p.y }; 
            return { x: (dx * u2.y - dy * u2.x) / det, y: (u1.x * dy - u1.y * dx) / det };
        }

        function localToScreen(lx, ly) {
            if (!state.plane.active) return { x: lx, y: ly };
            const { origin, activeUx: u1, activeUy: u2 } = state.plane;
            return { x: origin.x + lx * u1.x + ly * u2.x, y: origin.y + lx * u1.y + ly * u2.y };
        }

        function calculateDistance(p1, p2) { return Math.hypot(p2.x - p1.x, p2.y - p1.y); }
        
        function getRealDistance(p1, p2) {
            const l1 = screenToLocal(p1); const l2 = screenToLocal(p2);
            return calculateDistance(l1, l2);
        }

        function formatValue(value_in_local_pixels) {
            let val = (value_in_local_pixels / state.scaleFactor);
            val = state.smartRounding ? Math.round(val) : val.toFixed(2);
            return `${val} ${state.unit}`;
        }

        function getRandomColor() {
            const colors = ['#f43f5e', '#f97316', '#eab308', '#22c55e', '#0ea5e9', '#8b5cf6', '#d946ef', '#14b8a6', '#ef4444', '#3b82f6'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        function getMouseWorldPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: ((e.clientX - rect.left) - view.x) / view.scale, y: ((e.clientY - rect.top) - view.y) / view.scale };
        }

        function getDrawingOrigin() {
            if (!state.isDrawing || !state.currentTrace) return null;
            if (['line', 'parallel-draw', 'calibrate', 'angle'].includes(state.mode)) return state.currentTrace.points[0];
            if (state.mode === 'polyline' && state.currentTrace.points.length > 0) return state.currentTrace.points[state.currentTrace.points.length - 1];
            return null;
        }

        function applyConstraints(pos, origin) {
            if (!origin) return pos;
            
            if (state.mode === 'parallel-draw' && state.parallelAngle !== null) {
                const ux = Math.cos(state.parallelAngle); const uy = Math.sin(state.parallelAngle);
                const vx = pos.x - origin.x; const vy = pos.y - origin.y;
                const t = vx * ux + vy * uy; 
                return { x: origin.x + t * ux, y: origin.y + t * uy };
            }
            
            if (state.orthoMode && ['line', 'polyline', 'calibrate'].includes(state.mode)) {
                const lPos = screenToLocal(pos); const lOrig = screenToLocal(origin);
                const dx = Math.abs(lPos.x - lOrig.x); const dy = Math.abs(lPos.y - lOrig.y);
                if (dx > dy) lPos.y = lOrig.y; else lPos.x = lOrig.x;
                return localToScreen(lPos.x, lPos.y);
            }
            return pos;
        }

        function getPerpendicularPoint(P, A, B) {
            const dx = B.x - A.x; const dy = B.y - A.y;
            if (dx === 0 && dy === 0) return null;
            const t = ((P.x - A.x) * dx + (P.y - A.y) * dy) / (dx * dx + dy * dy);
            if (t < 0 || t > 1) return null; 
            return { x: A.x + t * dx, y: A.y + t * dy };
        }

        function getSegmentsFromTrace(m) {
            let segs = [];
            if(['Línea', 'Línea (Paralela)', 'Ángulo', 'Ejes'].includes(m.type)) {
                if(m.points.length >= 2) segs.push({a: m.points[0], b: m.points[1]});
                if(m.points.length === 3) segs.push({a: m.points[0], b: m.points[2]});
            } else if(m.type === 'Polilínea') {
                for(let i=0; i<m.points.length-1; i++) segs.push({a: m.points[i], b: m.points[i+1]});
            }
            return segs;
        }

        function calculateSnap(worldPos, drawingOrigin) {
            if(state.mode === 'none') return null;
            let bestSnap = null; let minWorldDist = 18 / view.scale; 

            function trySnap(type, pt, seg = null) {
                if(!pt) return;
                const d = calculateDistance(worldPos, pt);
                if (d < minWorldDist) { minWorldDist = d; bestSnap = { type, pt, seg }; }
            }

            state.measurements.forEach(m => {
                const segs = getSegmentsFromTrace(m);
                if(state.snaps.endpoint) segs.forEach(s => { trySnap('endpoint', s.a, s); trySnap('endpoint', s.b, s); });
                if(state.snaps.midpoint) segs.forEach(s => trySnap('midpoint', { x: (s.a.x+s.b.x)/2, y: (s.a.y+s.b.y)/2 }, s));
                if(state.snaps.center && m.type === 'Círculo 3D' && m.screenCenter) trySnap('center', m.screenCenter);
                if(state.snaps.perpendicular && drawingOrigin) segs.forEach(s => trySnap('perpendicular', getPerpendicularPoint(drawingOrigin, s.a, s.b), s));
            });
            return bestSnap;
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('presetScale').value = "";
            
            if (file.type === 'application/pdf') {
                const fr = new FileReader();
                fr.onload = function() {
                    pdfjsLib.getDocument(new Uint8Array(this.result)).promise.then(pdf => {
                        pdf.getPage(1).then(page => {
                            const viewport = page.getViewport({ scale: 2.5 }); 
                            const offscreen = document.createElement('canvas');
                            offscreen.width = viewport.width; offscreen.height = viewport.height;
                            page.render({ canvasContext: offscreen.getContext('2d'), viewport: viewport }).promise.then(() => {
                                docImage = offscreen; resetViewAndRender();
                            });
                        });
                    });
                }; fr.readAsArrayBuffer(file);
            } else if (file.type.startsWith('image/')) {
                const img = new Image(); img.onload = () => { docImage = img; resetViewAndRender(); }; img.src = URL.createObjectURL(file);
            }
        });

        function resetViewAndRender() {
            if (!docImage) return;
            const sX = canvas.width / docImage.width; const sY = canvas.height / docImage.height;
            view.scale = Math.min(sX, sY) * 0.9;
            view.x = (canvas.width - docImage.width * view.scale) / 2; view.y = (canvas.height - docImage.height * view.scale) / 2;
            setMode('none'); renderDrawings();
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault(); if(!docImage) return;
            const zoomFactor = Math.exp((e.deltaY < 0 ? 1 : -1) * 0.15);
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;

            view.x = mouseX - (mouseX - view.x) * zoomFactor;
            view.y = mouseY - (mouseY - view.y) * zoomFactor; view.scale *= zoomFactor; renderDrawings();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { isSpacePressed = true; if (docImage) canvas.style.cursor = 'grab'; }
            if (e.key === 'Escape') { setMode(state.mode); }
            if (e.key === 'Enter' && state.mode === 'polyline' && state.isDrawing) finishPolyline();
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') { isSpacePressed = false; if (!view.isPanning) canvas.style.cursor = state.mode !== 'none' ? 'crosshair' : 'default'; }
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 1 || isSpacePressed || (e.button === 0 && state.mode === 'none' && docImage)) {
                e.preventDefault(); view.isPanning = true;
                view.startX = e.clientX - view.x; view.startY = e.clientY - view.y;
                canvas.style.cursor = 'grabbing'; return;
            }
            if (e.button !== 0 || state.mode === 'none' || isSpacePressed) return;
            
            if (state.mode === 'parallel-select') {
                if (state.hoveredSegment) {
                    const dx = state.hoveredSegment.b.x - state.hoveredSegment.a.x; const dy = state.hoveredSegment.b.y - state.hoveredSegment.a.y;
                    state.parallelAngle = Math.atan2(dy, dx);
                    setMode('parallel-draw'); state.hoveredSegment = null;
                } else showMessage("Aviso", "Haz clic sobre una línea recta para copiar su inclinación.");
                return;
            }

            let rawPos = getMouseWorldPos(e);
            const origin = getDrawingOrigin();
            let constrainedPos = applyConstraints(rawPos, origin);
            activeSnap = calculateSnap(constrainedPos, origin);
            let pos = activeSnap ? activeSnap.pt : constrainedPos;
            if (activeSnap && origin && (state.orthoMode || state.mode === 'parallel-draw')) pos = applyConstraints(pos, origin); 

            function updateExtensionSnap() {
                if (activeSnap && activeSnap.type === 'endpoint' && activeSnap.seg) {
                    const s = activeSnap.seg; let dx = s.b.x - s.a.x; let dy = s.b.y - s.a.y;
                    const len = Math.hypot(dx, dy);
                    if (len > 0) state.extensionLine = { origin: activeSnap.pt, vector: { dx: dx/len, dy: dy/len } };
                } else { state.extensionLine = null; }
            }

            if (['calibrate', 'line', 'parallel-draw', 'polyline', 'angle', 'axis', 'circle3p'].includes(state.mode)) {
                if (!state.isDrawing) {
                    state.isDrawing = true;
                    updateExtensionSnap();
                    let tName = state.mode === 'calibrate' ? 'calib' : state.mode === 'parallel-draw' ? 'Línea (Paralela)' : state.mode === 'polyline' ? 'Polilínea' : state.mode === 'angle' ? 'Ángulo' : state.mode === 'axis' ? 'Ejes' : state.mode === 'circle3p' ? 'Círculo 3D' : 'Línea';
                    let clr = state.mode === 'calibrate' ? '#f43f5e' : state.mode === 'axis' ? '#a855f7' : getRandomColor();
                    state.currentTrace = { type: tName, color: clr, points: [pos], preview: pos };
                } else {
                    state.currentTrace.points.push(pos);
                    updateExtensionSnap();
                    
                    if (['calibrate', 'line', 'parallel-draw'].includes(state.mode) && state.currentTrace.points.length === 2) {
                        if (state.mode === 'calibrate') {
                            const pxDist = getRealDistance(state.currentTrace.points[0], state.currentTrace.points[1]);
                            if(pxDist > 5) openCalibrationModal(pxDist);
                            state.isDrawing = false; state.currentTrace = null;
                        } else {
                            state.currentTrace.valueLocalPx = getRealDistance(state.currentTrace.points[0], state.currentTrace.points[1]);
                            saveTrace();
                        }
                    }
                    else if (state.mode === 'axis' && state.currentTrace.points.length === 4) {
                        const [o, px, py, pz] = state.currentTrace.points;
                        const lenX = calculateDistance(px, o); const lenY = calculateDistance(py, o); const lenZ = calculateDistance(pz, o);
                        if (lenX > 5 && lenY > 5 && lenZ > 5) {
                            state.plane.origin = o;
                            state.plane.ux = { x: (px.x - o.x)/lenX, y: (px.y - o.y)/lenX };
                            state.plane.uy = { x: (py.x - o.x)/lenY, y: (py.y - o.y)/lenY };
                            state.plane.uz = { x: (pz.x - o.x)/lenZ, y: (pz.y - o.y)/lenZ };
                            state.plane.active = true;
                            state.plane.activePlane = 'XY';
                            state.plane.activeUx = { ...state.plane.ux };
                            state.plane.activeUy = { ...state.plane.uy };
                            
                            document.getElementById('btnResetAxis').classList.remove('hidden');
                            document.getElementById('btnActivePlane').classList.remove('hidden');
                            document.getElementById('btnViewAxes').classList.remove('hidden');
                            document.getElementById('btnActivePlane').textContent = '🔄 Plano: XY';
                            
                            document.getElementById('axisStatus').innerHTML = "<span class='text-amber-500 font-bold'>Espacio: 3D (Plano XY)</span>";
                            saveTrace(); setMode('line');
                        } else {
                            showMessage("Error", "Los ejes son muy pequeños. Intenta de nuevo."); setMode('axis');
                        }
                    }
                    else if (state.mode === 'angle' && state.currentTrace.points.length === 3) {
                        const [p1, p2, p3] = state.currentTrace.points;
                        const l1 = screenToLocal(p1); const l2 = screenToLocal(p2); const l3 = screenToLocal(p3);
                        const a1 = Math.atan2(l2.y - l1.y, l2.x - l1.x); const a2 = Math.atan2(l3.y - l1.y, l3.x - l1.x);
                        let angle = Math.abs((a1 - a2) * 180 / Math.PI); if (angle > 180) angle = 360 - angle;
                        state.currentTrace.angleValue = angle;
                        saveTrace();
                    }
                    else if (state.mode === 'circle3p' && state.currentTrace.points.length === 3) {
                        const [p1, p2, p3] = state.currentTrace.points;
                        const l1 = screenToLocal(p1); const l2 = screenToLocal(p2); const l3 = screenToLocal(p3);
                        const D = 2 * (l1.x * (l2.y - l3.y) + l2.x * (l3.y - l1.y) + l3.x * (l1.y - l2.y));
                        
                        if (Math.abs(D) > 0.0001) {
                            const cx = ((l1.x*l1.x + l1.y*l1.y) * (l2.y - l3.y) + (l2.x*l2.x + l2.y*l2.y) * (l3.y - l1.y) + (l3.x*l3.x + l3.y*l3.y) * (l1.y - l2.y)) / D;
                            const cy = ((l1.x*l1.x + l1.y*l1.y) * (l3.x - l2.x) + (l2.x*l2.x + l2.y*l2.y) * (l1.x - l3.x) + (l3.x*l3.x + l3.y*l3.y) * (l2.x - l1.x)) / D;
                            state.currentTrace.localCenter = {x: cx, y: cy};
                            state.currentTrace.localRadius = Math.hypot(cx - l1.x, cy - l1.y);
                            state.currentTrace.screenCenter = localToScreen(cx, cy);
                            state.currentTrace.valueLocalPx = state.currentTrace.localRadius * 2; 
                            
                            // Guardamos los vectores del plano para que el círculo no se rompa si se cambia de plano después
                            state.currentTrace.u1 = { ...state.plane.activeUx }; 
                            state.currentTrace.u2 = { ...state.plane.activeUy }; 
                            state.currentTrace.origin = { ...state.plane.origin };
                            
                            saveTrace();
                        } else {
                            showMessage("Error Geométrico", "Los 3 puntos están en línea recta."); setMode('circle3p');
                        }
                    }
                }
            }
            renderDrawings();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (view.isPanning) { view.x = e.clientX - view.startX; view.y = e.clientY - view.startY; renderDrawings(); return; }
            if (state.mode === 'none' && !state.isDrawing) return;

            let rawPos = getMouseWorldPos(e);
            
            if (state.mode === 'parallel-select') {
                state.hoveredSegment = null; let minDist = 15 / view.scale;
                state.measurements.forEach(m => {
                    const segs = getSegmentsFromTrace(m);
                    segs.forEach(s => {
                        const l2 = Math.pow(s.b.x - s.a.x, 2) + Math.pow(s.b.y - s.a.y, 2);
                        let t = l2 === 0 ? 0 : ((rawPos.x - s.a.x) * (s.b.x - s.a.x) + (rawPos.y - s.a.y) * (s.b.y - s.a.y)) / l2;
                        t = Math.max(0, Math.min(1, t));
                        const d = calculateDistance(rawPos, { x: s.a.x + t * (s.b.x - s.a.x), y: s.a.y + t * (s.b.y - s.a.y) });
                        if (d < minDist) { minDist = d; state.hoveredSegment = s; }
                    });
                });
                renderDrawings(); return;
            }

            const origin = getDrawingOrigin();
            let constrainedPos = applyConstraints(rawPos, origin);
            activeSnap = calculateSnap(constrainedPos, origin);
            let pos = activeSnap ? activeSnap.pt : constrainedPos;
            if (activeSnap && origin && (state.orthoMode || state.mode === 'parallel-draw')) pos = applyConstraints(pos, origin); 

            state.isTrackingExtension = false;
            if (state.isDrawing && state.extensionLine && !activeSnap && ['line','polyline'].includes(state.mode)) {
                const exL = state.extensionLine; const vX = rawPos.x - exL.origin.x; const vY = rawPos.y - exL.origin.y;
                const dist = Math.abs(vX * exL.vector.dy - vY * exL.vector.dx);
                if (dist < 15 / view.scale) {
                    const dot = vX * exL.vector.dx + vY * exL.vector.dy;
                    pos = { x: exL.origin.x + dot * exL.vector.dx, y: exL.origin.y + dot * exL.vector.dy };
                    state.isTrackingExtension = true;
                }
            }

            if (state.isDrawing && state.currentTrace) { 
                state.currentTrace.preview = pos; 
                
                if (state.mode === 'circle3p' && state.currentTrace.points.length === 2) {
                    const p1 = state.currentTrace.points[0]; const p2 = state.currentTrace.points[1];
                    const l1 = screenToLocal(p1); const l2 = screenToLocal(p2); const l3 = screenToLocal(pos);
                    const D = 2 * (l1.x * (l2.y - l3.y) + l2.x * (l3.y - l1.y) + l3.x * (l1.y - l2.y));
                    if (Math.abs(D) > 0.0001) {
                        const cx = ((l1.x*l1.x + l1.y*l1.y) * (l2.y - l3.y) + (l2.x*l2.x + l2.y*l2.y) * (l3.y - l1.y) + (l3.x*l3.x + l3.y*l3.y) * (l1.y - l2.y)) / D;
                        const cy = ((l1.x*l1.x + l1.y*l1.y) * (l3.x - l2.x) + (l2.x*l2.x + l2.y*l2.y) * (l1.x - l3.x) + (l3.x*l3.x + l3.y*l3.y) * (l2.x - l1.x)) / D;
                        state.currentTrace.previewLocalCenter = {x: cx, y: cy};
                        state.currentTrace.previewLocalRadius = Math.hypot(cx - l1.x, cy - l1.y);
                    } else {
                        state.currentTrace.previewLocalCenter = null;
                    }
                }
            }
            renderDrawings();
        });

        window.addEventListener('mouseup', () => { if (view.isPanning) { view.isPanning = false; canvas.style.cursor = isSpacePressed ? 'grab' : 'crosshair'; } });
        canvas.addEventListener('dblclick', () => { if (state.mode === 'polyline' && state.isDrawing) finishPolyline(); });

        function finishPolyline() {
            if (state.currentTrace.points.length > 1) {
                let totalLocalPx = 0;
                for(let i=0; i<state.currentTrace.points.length-1; i++) totalLocalPx += getRealDistance(state.currentTrace.points[i], state.currentTrace.points[i+1]);
                state.currentTrace.valueLocalPx = totalLocalPx;
                saveTrace();
            } else { setMode('none'); }
        }

        function saveTrace() {
            delete state.currentTrace.preview;
            state.currentTrace.id = Date.now();
            state.measurements.push({...state.currentTrace});
            state.isDrawing = false; state.currentTrace = null; activeSnap = null;
            state.extensionLine = null; state.isTrackingExtension = false;
            updateSidebar(); renderDrawings();
            
            if(state.mode === 'axis') setMode('line');
        }

        function setMode(mode) {
            if(!docImage && mode !== 'none') { showMessage('Atención', 'Sube un documento primero.'); return; }
            state.mode = mode; state.isDrawing = false; state.currentTrace = null; activeSnap = null; state.hoveredSegment = null;
            state.extensionLine = null; state.isTrackingExtension = false;
            
            document.querySelectorAll('.tool-btn').forEach(btn => { btn.classList.remove('active', 'active-parallel', 'active-axis'); });
            if(mode !== 'none') {
                let sClass = 'active'; if(mode.startsWith('parallel')) sClass = 'active-parallel'; else if(mode==='axis') sClass = 'active-axis';
                const btn = document.querySelector(`[onclick="setMode('${mode.startsWith('parallel')?'parallel-select':mode}')"]`);
                if(btn) btn.classList.add(sClass);
                canvas.style.cursor = mode === 'parallel-select' ? 'pointer' : 'crosshair';
            } else canvas.style.cursor = 'default';

            const hint = document.getElementById('modeHint');
            switch(mode) {
                case 'calibrate': hint.textContent = "Calibración: Clica 2 puntos en el plano para definir la escala."; break;
                case 'line': hint.textContent = "Línea: Clica inicio y fin."; break;
                case 'parallel-select': hint.innerHTML = "<span class='text-amber-500 font-bold'>Paso 1:</span> Selecciona una línea trazada para copiar su ángulo."; break;
                case 'parallel-draw': hint.innerHTML = "<span class='text-amber-500 font-bold'>Paso 2:</span> Traza la línea. Su inclinación está bloqueada."; break;
                case 'polyline': hint.textContent = "Polilínea: Clica vértices. Doble click o Enter para terminar."; break;
                case 'axis': hint.innerHTML = "<span class='text-violet-500 font-bold'>Ejes 3D:</span> Clica 4 puntos: Origen -> Dir. X (Rojo) -> Dir. Y (Verde) -> Dir. Z (Azul)."; break;
                case 'angle': hint.textContent = "Ángulo: Clica Vértice -> Punto Lado 1 -> Punto Lado 2."; break;
                case 'circle3p': hint.textContent = "Círculo 3D: Clica 3 puntos en el borde del óvalo."; break;
                default: hint.textContent = "Selecciona una herramienta para empezar a medir.";
            }
            renderDrawings();
        }

        let pendingCalibPx = 0;
        function openCalibrationModal(pxDist) {
            pendingCalibPx = pxDist; document.getElementById('calibDistance').value = '';
            document.getElementById('calibrationModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('calibDistance').focus(), 50);
        }

        function applyPredefinedScale(widthMm) {
            if (!widthMm) return;
            if (!docImage) {
                showMessage('Atención', 'Sube un documento primero para aplicar una escala predeterminada.');
                document.getElementById('presetScale').value = "";
                return;
            }
            const realWidth = parseFloat(widthMm);
            state.unit = 'mm';
            state.scaleFactor = docImage.width / realWidth;
            document.getElementById('presetScale').blur();
            
            document.getElementById('scaleDisplay').textContent = `1 ${state.unit} = ${state.scaleFactor.toFixed(2)} px`;
            updateSidebar();
            renderDrawings();
            setMode('none');
        }

        document.getElementById('calibCancel').addEventListener('click', () => { document.getElementById('calibrationModal').classList.add('hidden'); setMode('none'); });
        document.getElementById('calibSave').addEventListener('click', () => {
            const realVal = parseFloat(document.getElementById('calibDistance').value);
            if(isNaN(realVal) || realVal <= 0) { showMessage('Atención', 'Introduce un número válido.'); return; }
            state.unit = document.getElementById('calibUnit').value;
            state.scaleFactor = pendingCalibPx / realVal;
            document.getElementById('scaleDisplay').textContent = `1 ${state.unit} = ${state.scaleFactor.toFixed(2)} px`;
            document.getElementById('calibrationModal').classList.add('hidden');
            setMode('none'); updateSidebar(); renderDrawings();
        });

        function renderDrawings() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!docImage) return;

            ctx.save();
            ctx.translate(view.x, view.y); ctx.scale(view.scale, view.scale);
            ctx.drawImage(docImage, 0, 0);

            if (state.mode === 'parallel-select' && state.hoveredSegment) {
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 6 / view.scale; ctx.beginPath();
                ctx.moveTo(state.hoveredSegment.a.x, state.hoveredSegment.a.y); ctx.lineTo(state.hoveredSegment.b.x, state.hoveredSegment.b.y); ctx.stroke();
            }

            if (state.isTrackingExtension && state.extensionLine) {
                ctx.save(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5 / view.scale; ctx.setLineDash([8 / view.scale, 8 / view.scale]);
                ctx.beginPath(); const L = 10000;
                ctx.moveTo(state.extensionLine.origin.x - state.extensionLine.vector.dx * L, state.extensionLine.origin.y - state.extensionLine.vector.dy * L);
                ctx.lineTo(state.extensionLine.origin.x + state.extensionLine.vector.dx * L, state.extensionLine.origin.y + state.extensionLine.vector.dy * L);
                ctx.stroke(); ctx.restore();
            }

            state.measurements.forEach(m => drawTrace(m, false));
            if (state.currentTrace) drawTrace(state.currentTrace, true);

            drawSnapIndicator();
            ctx.restore();
        }

        function drawTrace(trace, isPreview) {
            ctx.lineWidth = isPreview ? 2.5 / view.scale : 3 / view.scale; 
            ctx.setLineDash(isPreview ? [6/view.scale, 6/view.scale] : []);
            const ptRadius = 5 / view.scale;

            // FIX BUG 1 & 3D: Lógica correcta para dibujar Ejes
            if (trace.type === 'Ejes') {
                if (trace.points.length > 0) {
                    // Si ya están guardados, solo dibujarlos si el usuario mantiene presionado "Ver Ejes"
                    if (!isPreview && !state.showAxes) return;

                    const drawLine = (p1, p2, color) => { ctx.strokeStyle = color; ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); };
                    const o = trace.points[0];

                    // Eje X (Rojo)
                    if (trace.points.length > 1) drawLine(o, trace.points[1], '#ef4444');
                    else if (isPreview && trace.points.length === 1 && trace.preview) drawLine(o, trace.preview, '#ef4444');

                    // Eje Y (Verde)
                    if (trace.points.length > 2) drawLine(o, trace.points[2], '#22c55e');
                    else if (isPreview && trace.points.length === 2 && trace.preview) drawLine(o, trace.preview, '#22c55e');
                    
                    // Eje Z (Azul)
                    if (trace.points.length > 3) drawLine(o, trace.points[3], '#3b82f6');
                    else if (isPreview && trace.points.length === 3 && trace.preview) drawLine(o, trace.preview, '#3b82f6');

                    // Puntos dibujados en morado para ejes
                    ctx.fillStyle = '#a855f7';
                    trace.points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, ptRadius, 0, Math.PI*2); ctx.fill(); });
                }
                return; // Evitamos el resto de la lógica para otras líneas
            }

            ctx.strokeStyle = trace.color;
            ctx.fillStyle = trace.color;

            if (['Línea', 'Línea (Paralela)', 'calib'].includes(trace.type)) {
                if(trace.points.length > 0) {
                    ctx.beginPath(); ctx.moveTo(trace.points[0].x, trace.points[0].y);
                    if(trace.points.length > 1) ctx.lineTo(trace.points[1].x, trace.points[1].y);
                    else if(isPreview && trace.preview) ctx.lineTo(trace.preview.x, trace.preview.y);
                    ctx.stroke();
                    trace.points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, ptRadius, 0, Math.PI*2); ctx.fill(); });
                }
                if(!isPreview && trace.valueLocalPx) drawText(formatValue(trace.valueLocalPx), (trace.points[0].x + trace.points[1].x)/2, (trace.points[0].y + trace.points[1].y)/2, trace.color);
            } 
            else if (trace.type === 'Polilínea') {
                ctx.beginPath();
                if(trace.points.length > 0) {
                    ctx.moveTo(trace.points[0].x, trace.points[0].y);
                    for(let i=1; i<trace.points.length; i++) ctx.lineTo(trace.points[i].x, trace.points[i].y);
                    if(isPreview && trace.preview) ctx.lineTo(trace.preview.x, trace.preview.y);
                }
                ctx.stroke();
                trace.points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, ptRadius, 0, Math.PI*2); ctx.fill(); });
                if(!isPreview && trace.valueLocalPx) drawText(formatValue(trace.valueLocalPx), trace.points[trace.points.length-1].x, trace.points[trace.points.length-1].y - (25/view.scale), trace.color);
            }
            else if (trace.type === 'Ángulo') {
                if(trace.points.length > 0) {
                    ctx.beginPath(); ctx.moveTo(trace.points[0].x, trace.points[0].y);
                    if(trace.points.length > 1) ctx.lineTo(trace.points[1].x, trace.points[1].y);
                    else if(isPreview && trace.preview) ctx.lineTo(trace.preview.x, trace.preview.y);
                    ctx.stroke();
                    
                    if(trace.points.length > 1) {
                        ctx.beginPath(); ctx.moveTo(trace.points[0].x, trace.points[0].y);
                        if(trace.points.length > 2) ctx.lineTo(trace.points[2].x, trace.points[2].y);
                        else if(isPreview && trace.preview) ctx.lineTo(trace.preview.x, trace.preview.y);
                        ctx.stroke();
                    }
                    trace.points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, ptRadius, 0, Math.PI*2); ctx.fill(); });
                }
                if(!isPreview && trace.angleValue !== undefined) {
                    const angText = `${state.smartRounding ? Math.round(trace.angleValue) : trace.angleValue.toFixed(1)}º`;
                    drawText(angText, trace.points[0].x, trace.points[0].y - (25/view.scale), trace.color);
                }
            }
            else if (trace.type === 'Círculo 3D') {
                trace.points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, ptRadius, 0, Math.PI*2); ctx.fill(); });
                if (isPreview && trace.preview) { ctx.beginPath(); ctx.arc(trace.preview.x, trace.preview.y, ptRadius, 0, Math.PI*2); ctx.fill(); }
                
                const center = isPreview ? trace.previewLocalCenter : trace.localCenter;
                const radius = isPreview ? trace.previewLocalRadius : trace.localRadius;

                if (center && radius) {
                    ctx.beginPath();
                    const traceLocalToScreen = (lx, ly) => {
                        if (!isPreview && trace.u1 && trace.u2 && trace.origin) {
                            return { x: trace.origin.x + lx * trace.u1.x + ly * trace.u2.x, y: trace.origin.y + lx * trace.u1.y + ly * trace.u2.y };
                        }
                        return localToScreen(lx, ly);
                    };

                    for (let i = 0; i <= 360; i += 5) {
                        const rad = i * Math.PI / 180;
                        const lx = center.x + radius * Math.cos(rad);
                        const ly = center.y + radius * Math.sin(rad);
                        const screenPt = traceLocalToScreen(lx, ly);
                        if (i === 0) ctx.moveTo(screenPt.x, screenPt.y); else ctx.lineTo(screenPt.x, screenPt.y);
                    }
                    ctx.closePath(); ctx.stroke();
                    
                    if (!isPreview && trace.screenCenter) {
                        const cross = 10/view.scale; const sc = trace.screenCenter;
                        ctx.beginPath(); ctx.moveTo(sc.x - cross, sc.y); ctx.lineTo(sc.x + cross, sc.y); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(sc.x, sc.y - cross); ctx.lineTo(sc.x, sc.y + cross); ctx.stroke();
                        
                        drawText(`Ø ${formatValue(trace.valueLocalPx)}`, sc.x, sc.y, trace.color);
                    }
                }
            }
        }

        function drawSnapIndicator() {
            if (!activeSnap) return;
            const pt = activeSnap.pt; const size = 14 / view.scale; const s2 = size/2;
            ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2.5 / view.scale; ctx.setLineDash([]); ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';

            ctx.beginPath();
            if (activeSnap.type === 'endpoint') ctx.rect(pt.x - s2, pt.y - s2, size, size);
            else if (activeSnap.type === 'midpoint') { ctx.moveTo(pt.x, pt.y - s2); ctx.lineTo(pt.x + s2, pt.y + s2); ctx.lineTo(pt.x - s2, pt.y + s2); ctx.closePath(); }
            else if (activeSnap.type === 'center') ctx.arc(pt.x, pt.y, s2, 0, Math.PI*2);
            else if (activeSnap.type === 'perpendicular') {
                ctx.moveTo(pt.x - s2, pt.y - s2); ctx.lineTo(pt.x - s2, pt.y + s2); ctx.lineTo(pt.x + s2, pt.y + s2);
                ctx.lineTo(pt.x + s2, pt.y + s2 - (size*0.3)); ctx.lineTo(pt.x - s2 + (size*0.3), pt.y + s2 - (size*0.3));
                ctx.lineTo(pt.x - s2 + (size*0.3), pt.y - s2); ctx.closePath();
            }
            ctx.fill(); ctx.stroke();
            
            if (state.isDrawing && getDrawingOrigin()) {
               ctx.beginPath(); ctx.moveTo(getDrawingOrigin().x, getDrawingOrigin().y); ctx.lineTo(pt.x, pt.y);
               ctx.strokeStyle = 'rgba(34, 197, 94, 0.4)'; ctx.lineWidth = 1/view.scale; ctx.stroke();
            }
        }

        function drawText(text, x, y, color) {
            const fs = 14 / view.scale; ctx.font = `600 ${fs}px 'JetBrains Mono', monospace`;
            const met = ctx.measureText(text); const padX = 8/view.scale; const padY = 6/view.scale;
            const isDark = document.documentElement.classList.contains('dark');
            ctx.fillStyle = isDark ? 'rgba(15, 23, 42, 0.9)' : 'rgba(255, 255, 255, 0.9)'; 
            ctx.strokeStyle = color; ctx.lineWidth = 1.5/view.scale; ctx.setLineDash([]);
            
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x - met.width/2 - padX, y - fs/2 - padY, met.width + padX*2, fs + padY*2, 4/view.scale);
            else ctx.rect(x - met.width/2 - padX, y - fs/2 - padY, met.width + padX*2, fs + padY*2);
            ctx.fill(); ctx.stroke();
            
            ctx.fillStyle = isDark ? '#ffffff' : '#0f172a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y);
        }

        function updateSidebar() {
            const container = document.getElementById('measurementsList');
            const validMeasurements = state.measurements.filter(m => m.type !== 'Ejes');
            document.getElementById('measureCount').textContent = validMeasurements.length;
            container.innerHTML = '';

            if (validMeasurements.length === 0) {
                container.innerHTML = `<div class="text-sm text-center text-slate-500 italic mt-10">Sin medidas registradas.<br/>Dibuja en el lienzo para comenzar.</div>`; return;
            }

            [...validMeasurements].reverse().forEach((m, idx) => {
                const indexReal = validMeasurements.length - idx;
                const div = document.createElement('div');
                div.className = 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-3 shadow-sm flex items-center justify-between group hover:border-sky-400 dark:hover:border-sky-500/50 transition-colors';
                
                let iconStr = ''; let displayVal = ''; let extraInfo = '';
                
                if(['Línea', 'Línea (Paralela)'].includes(m.type)) {
                    iconStr = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>';
                    displayVal = formatValue(m.valueLocalPx);
                }
                else if(m.type === 'Polilínea') {
                    iconStr = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>';
                    displayVal = formatValue(m.valueLocalPx);
                }
                else if(m.type === 'Ángulo') {
                    iconStr = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21a9 9 0 009-9H3a9 9 0 009 9zM12 3a9 9 0 00-9 9h18a9 9 0 00-9-9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12L21 12M12 12L18.36 5.64"></path>';
                    displayVal = `${state.smartRounding ? Math.round(m.angleValue) : m.angleValue.toFixed(2)} º`;
                }
                else if(m.type === 'Círculo 3D') {
                    iconStr = '<circle cx="12" cy="12" r="9" stroke-width="2" stroke-dasharray="2 2"></circle><circle cx="12" cy="12" r="2" fill="currentColor"></circle>';
                    displayVal = `Ø ${formatValue(m.valueLocalPx)}`;
                    extraInfo = `<span class="text-[10px] block opacity-70">R ${formatValue(m.valueLocalPx / 2)}</span>`;
                }

                div.innerHTML = `
                    <div class="flex items-center gap-3 w-full">
                        <div class="relative flex-shrink-0">
                            <input type="color" value="${m.color}" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer z-10 color-input" data-id="${m.id}" title="Cambiar color">
                            <div class="w-8 h-8 rounded-md border border-slate-300 dark:border-slate-600 flex items-center justify-center text-white shadow-inner transition-colors" style="background-color: ${m.color}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">${iconStr}</svg>
                            </div>
                        </div>
                        <div class="flex flex-col flex-1 min-w-0">
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider truncate">${m.type} ${indexReal}</span>
                            <span class="font-mono font-bold text-slate-800 dark:text-slate-100 text-sm truncate" title="${displayVal}">${displayVal}</span>
                            ${extraInfo}
                        </div>
                        <button class="text-slate-400 hover:text-red-500 bg-slate-50 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-slate-700 rounded-md transition-colors p-2 del-btn flex-shrink-0" data-id="${m.id}" title="Eliminar trazo">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });

            document.querySelectorAll('.color-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const trace = state.measurements.find(x => x.id === parseInt(e.target.dataset.id));
                    if(trace) { trace.color = e.target.value; e.target.nextElementSibling.style.backgroundColor = trace.color; renderDrawings(); }
                });
            });
            document.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.measurements = state.measurements.filter(x => x.id !== parseInt(e.currentTarget.dataset.id));
                    updateSidebar(); renderDrawings();
                });
            });
        }
    </script>
</body>
</html>
